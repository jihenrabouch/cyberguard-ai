version: '3.8'

# ==============================================================================
# Docker Compose de Developpement — Projet Federateur AI-BD_BI
# Services : Qdrant (Base Vectorielle HNSW) & PostgreSQL 16 (Metadonnees)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Base de Donnees Vectorielle Dediee : Qdrant
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: federateur_qdrant_dev
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333" # API REST et Dashboard Web
      - "${QDRANT_GRPC_PORT:-6334}:6334" # API gRPC haute performance
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Base de Donnees Relationnelle : PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: federateur_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretdevpassword}
      POSTGRES_DB: ${POSTGRES_DB:-federateur_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-federateur_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ------------------------------------------------------------------------------
# Volumes & Reseau
# ------------------------------------------------------------------------------
volumes:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local

networks:
  backend-net:
    driver: bridge

